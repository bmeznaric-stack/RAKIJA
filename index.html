<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rakija Optimizer PRO</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon-192.png">

<meta name="theme-color" content="#7b4519">
</head>

<body>
<div class="app">
<h1>🥃 Rakija Optimizer PRO</h1>

<h3>Moj podrum</h3>

<table id="tablica">
<tr>
<th>Naziv</th>
<th>Litara</th>
<th>% alkohola</th>
<th></th>
</tr>
</table>

<button onclick="dodajRed()">➕ Dodaj rakiju</button>

<h3>Ciljana jačina</h3>
<input id="cilj" type="number" value="45">

<button onclick="izracunaj()">🧮 IZRAČUNAJ</button>

<div id="rezultat">
Rezultat će biti ovdje.
</div>
</div>

<script>
let podrum=[];

function spremi(){
localStorage.setItem("rakijaPodrum",JSON.stringify(podrum));
}

function ucitaj(){
let x=localStorage.getItem("rakijaPodrum");
if(x) podrum=JSON.parse(x);
prikazi();
}

function dodajRed(){
podrum.push({naziv:"",litre:"",stupanj:""});
spremi();
prikazi();
}

function obrisi(i){
podrum.splice(i,1);
spremi();
prikazi();
}

function promjena(i,p,v){
podrum[i][p]=v;
spremi();
}

function prikazi(){
let tab=document.getElementById("tablica");
tab.innerHTML="<tr><th>Naziv</th><th>Litara</th><th>°</th><th></th></tr>";

podrum.forEach((r,i)=>{
tab.innerHTML+=`
<tr>
<td><input value="${r.naziv}" oninput="promjena(${i},'naziv',this.value)"></td>
<td><input type="number" value="${r.litre}" oninput="promjena(${i},'litre',this.value)"></td>
<td><input type="number" value="${r.stupanj}" oninput="promjena(${i},'stupanj',this.value)"></td>
<td><button onclick="obrisi(${i})">🗑</button></td>
</tr>`;
});
}

function izracunaj(){
let ukupno=0;
let alkohol=0;

podrum.forEach(r=>{
let l=parseFloat(r.litre);
let a=parseFloat(r.stupanj);
if(!isNaN(l)&&!isNaN(a)){
ukupno+=l;
alkohol+=l*a/100;
}
});

if(!ukupno){
rezultat.innerHTML="Nema unesenih podataka.";
return;
}

let trenutni=alkohol/ukupno*100;
let cilj=parseFloat(document.getElementById("cilj").value);

let tekst="Ukupno rakije: <b>"+ukupno.toFixed(2)+" L</b><br>";
tekst+="Trenutna jačina: <b>"+trenutni.toFixed(2)+"°</b><br>";

if(cilj<trenutni){
let voda=(alkohol/(cilj/100))-ukupno;
tekst+="Voda za dodavanje: <b>"+voda.toFixed(2)+" L</b>";
}else{
tekst+="Nije potrebno razrjeđivanje.";
}

document.getElementById("rezultat").innerHTML=tekst;
}

ucitaj();

if("serviceWorker" in navigator){
navigator.serviceWorker.register("./service-worker.js");
}
</script>

<style>
body{
font-family:Arial;
background:#f1eee8;
padding:15px;
}
.app{
max-width:800px;
margin:auto;
background:white;
padding:20px;
border-radius:18px;
}
table{
width:100%;
border-collapse:collapse;
}
td,th{
border:1px solid #ccc;
padding:6px;
text-align:center;
}
button{
width:100%;
padding:12px;
margin-top:10px;
background:#6b3a12;
color:white;
border:0;
border-radius:10px;
}
</style>

</body>
</html>
