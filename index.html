<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rakija Optimizer PRO</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<meta name="theme-color" content="#6b3a12">
<style>
body{font-family:Arial;background:linear-gradient(#f5e6c8,#d8b27c);padding:15px;color:#3b1f08}
.app{max-width:520px;margin:auto;background:#fffaf0;padding:20px;border-radius:22px;box-shadow:0 8px 25px #999}
h1{text-align:center;color:#6b3a12}
.logo{text-align:center;font-size:45px}
.card{background:#f7ecd7;padding:15px;margin-top:15px;border-radius:16px}
input{width:100%;padding:10px;margin-top:5px;border-radius:10px}
button{width:100%;padding:13px;margin-top:10px;background:#6b3a12;color:white;border:0;border-radius:12px;font-weight:bold}
.rakija{background:white;border-left:6px solid #c8922e;padding:12px;margin-top:10px;border-radius:12px}
.result{background:white;padding:15px;margin-top:15px;border-radius:12px}
</style>
</head>
<body>
<div class="app">
<div class="logo">🥃</div>
<h1>Rakija Optimizer PRO</h1>
<div class="card"><h3>🍶 Moj podrum</h3><div id="lista"></div><button onclick="dodaj()">➕ Dodaj rakiju</button></div>
<div class="card"><h3>🎯 Ciljana jačina</h3><input id="cilj" value="45" type="number" oninput="calc()"><button onclick="calc()">🥃 IZRAČUNAJ SMJESU</button></div>
<div id="rez" class="result">Rezultat će biti ovdje.</div>
</div>
<script>
let podrum=JSON.parse(localStorage.getItem("rakijaPodrum")||"[]");
function save(){localStorage.setItem("rakijaPodrum",JSON.stringify(podrum))}
function dodaj(){podrum.push({naziv:"Šljivovica",litre:"",stupanj:""});save();show()}
function del(i){podrum.splice(i,1);save();show();calc()}
function ch(i,k,v){podrum[i][k]=v;save();calc()}
function show(){lista.innerHTML="";podrum.forEach((r,i)=>{lista.innerHTML+=`<div class="rakija"><b>🥃 ${r.naziv}</b><input value="${r.naziv}" oninput="ch(${i},'naziv',this.value)"><input type="number" placeholder="Litara" value="${r.litre}" oninput="ch(${i},'litre',this.value)"><input type="number" placeholder="Jačina" value="${r.stupanj}" oninput="ch(${i},'stupanj',this.value)"><button onclick="del(${i})">🗑 Obriši</button></div>`})}
function calc(){let l=0,a=0;podrum.forEach(r=>{let x=+r.litre,y=+r.stupanj;if(x&&y){l+=x;a+=x*y/100}});if(!l){rez.innerHTML="Nema podataka";return}let c=+cilj.value;let cur=a/l*100;let w=c<cur?a/(c/100)-l:0;rez.innerHTML=`🍶 Ukupno: <b>${l.toFixed(2)} L</b><br>📊 Jačina: <b>${cur.toFixed(2)}°</b><br>💧 Voda: <b>${w.toFixed(2)} L</b>`}
show();
if("serviceWorker" in navigator)navigator.serviceWorker.register("./service-worker.js");
</script>
</body>
</html>
