<!DOCTYPE html>
<html lang="hr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Rakija Optimizer PRO</title>

<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#7b4519">

</head>
<style>

body{
    font-family: Arial, sans-serif;
    background:#f1eee8;
    margin:0;
    padding:15px;
}

.app{
    max-width:800px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:18px;
    box-shadow:0 2px 10px #999;
}

h1{
    text-align:center;
    color:#6b3a12;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th{
    background:#6b3a12;
    color:white;
}

td,th{
    border:1px solid #ccc;
    padding:6px;
    text-align:center;
}

input{
    width:95%;
    padding:8px;
    border:0;
    text-align:center;
    font-size:16px;
}

button{

    width:100%;
    padding:12px;
    margin-top:12px;
    border:0;
    border-radius:10px;
    background:#6b3a12;
    color:white;
    font-size:16px;

}

.delete{
    background:#a00000;
    padding:5px;
    width:auto;
}

.result{

    margin-top:20px;
    background:#eee;
    padding:15px;
    border-radius:10px;
    line-height:1.6;

}


</style>

</head>


<body>


<div class="app">


<h1>🥃 Rakija Optimizer PRO</h1>


<h3>Moj podrum</h3>


<table id="tablica">

<tr>
<th>Naziv</th>
<th>Litara</th>
<th>% alkohola</th>
<th></th>
</tr>

</table>


<button onclick="dodajRed()">
➕ Dodaj rakiju
</button>



<h3>Ciljana jačina</h3>


<input 
id="cilj"
type="number"
value="45"
oninput="spremi()"
>


<button onclick="izracunaj()">
🧮 IZRAČUNAJ
</button>


<div class="result" id="rezultat">

Rezultat će biti ovdje.

</div>



</div>



<script>


let podrum=[];



function ucitaj(){

let spremljeno=
localStorage.getItem("rakijaPodrum");


if(spremljeno){

podrum=JSON.parse(spremljeno);

}

prikazi();

}



function spremi(){

localStorage.setItem(
"rakijaPodrum",
JSON.stringify(podrum)
);

}



function dodajRed(){

podrum.push({

naziv:"",
litre:"",
stupanj:""

});


spremi();

prikazi();

}



function obrisi(i){

podrum.splice(i,1);

spremi();

prikazi();

}



function promjena(i,polje,vrijednost){

podrum[i][polje]=vrijednost;

spremi();

}




function prikazi(){


let tab=document.getElementById("tablica");


tab.innerHTML=
`
<tr>
<th>Naziv</th>
<th>Litara</th>
<th>°</th>
<th></th>
</tr>
`;



podrum.forEach((r,i)=>{


tab.innerHTML+=`

<tr>

<td>
<input 
value="${r.naziv}"
oninput="promjena(${i},'naziv',this.value)">
</td>


<td>
<input 
type="number"
value="${r.litre}"
oninput="promjena(${i},'litre',this.value)">
</td>


<td>
<input 
type="number"
value="${r.stupanj}"
oninput="promjena(${i},'stupanj',this.value)">
</td>


<td>

<button 
class="delete"
onclick="obrisi(${i})">

🗑

</button>

</td>


</tr>

`;


});


}



function izracunaj(){


let ukupno=0;

let alkohol=0;


podrum.forEach(r=>{


let l=parseFloat(r.litre);

let a=parseFloat(r.stupanj);



if(!isNaN(l)&&!isNaN(a)){


ukupno+=l;

alkohol+=l*a/100;


}


});



if(ukupno==0){

document.getElementById("rezultat").innerHTML=
"Nema unesenih podataka.";

return;

}



let trenutni=
alkohol/ukupno*100;



let cilj=
parseFloat(
document.getElementById("cilj").value
);



let tekst="";


tekst+=
"Ukupno rakije: <b>"+
ukupno.toFixed(2)+
" L</b><br>";



tekst+=
"Trenutna jačina: <b>"+
trenutni.toFixed(2)+
"°</b><br>";



if(cilj<trenutni){


let voda=
(alkohol/(cilj/100))-ukupno;



tekst+=
"Za dobiti "+
cilj+
"° treba dodati:<br><br>";

tekst+=
"💧 Voda: <b>"+
voda.toFixed(2)+
" L</b><br>";

tekst+=
"Konačna količina: <b>"+
(ukupno+voda).toFixed(2)+
" L</b>";



}

else if(cilj==trenutni){


tekst+="✅ Već imaš željenu jačinu.";


}

else{


tekst+=
"⚠️ Potrebna je jača rakija.";


}



document.getElementById("rezultat").innerHTML=
tekst;


}




ucitaj();



if("serviceWorker" in navigator){

navigator.serviceWorker.register(
"service-worker.js"
);

}


</script>


</body>
</html>
